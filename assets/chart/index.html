<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Market Analyst Chart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --chart-background: #0f1216;
      --chart-text: #f3f4f6;
      --chart-muted: #9ca3af;
      --chart-subtle: #6b7280;
      --chart-surface: #1e2227;
      --chart-surface-hover: #2d3238;
      --chart-border: #374151;
      --chart-accent: #6b7280;
      --chart-selection-text: #ffffff;
    }
    html, body { width: 100%; height: 100%; background: var(--chart-background) !important; color: var(--chart-text); font-family: Arial, sans-serif; overflow: hidden; }
    #chart-wrapper { position: relative; width: 100%; height: 100%; background: var(--chart-background) !important; }
    #chart-container { width: 100%; height: 100%; background: var(--chart-background) !important; }
    #chart-container table, #chart-container td, #chart-container canvas { border: none !important; outline: none !important; }
    #timeframe-selector { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; z-index: 10; }
    #timeframe-selector button { background: var(--chart-surface); color: var(--chart-muted); border: 1px solid var(--chart-border); padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: Arial, sans-serif; }
    #timeframe-selector button:hover { background: var(--chart-surface-hover); color: var(--chart-text); }
    #timeframe-selector button.active { background: var(--chart-accent); color: var(--chart-selection-text); border-color: var(--chart-accent); }
    #source-zone-toggle { position: absolute; top: 42px; right: 10px; z-index: 10; display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 3px 8px; background: var(--chart-surface); color: var(--chart-muted); border: 1px solid var(--chart-border); border-radius: 4px; cursor: pointer; font-size: 11px; user-select: none; }
    #source-zone-toggle:hover { color: var(--chart-text); background: var(--chart-surface-hover); }
    #source-zone-toggle input { width: 14px; height: 14px; margin: 0; accent-color: var(--chart-accent); cursor: pointer; }
    #smc-caption { position: absolute; top: 10px; left: 10px; z-index: 10; display: none; max-width: 55%; padding: 3px 8px; background: var(--chart-surface); color: var(--chart-muted); border: 1px solid var(--chart-border); border-radius: 4px; font-size: 11px; font-family: Arial, sans-serif; }
    #empty-state, #error-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: var(--chart-subtle); font-size: 14px; display: none; z-index: 5; pointer-events: none; }
    #watermark { position: absolute; bottom: 8px; left: 10px; color: var(--chart-subtle); font-size: 10px; opacity: 0.3; z-index: 5; pointer-events: none; }
    
    /* Light theme styles */
    html.light-theme, body.light-theme { background: var(--chart-background) !important; color: var(--chart-text); }
    body.light-theme #chart-wrapper, body.light-theme #chart-container { background: var(--chart-background) !important; }
    body.light-theme #timeframe-selector button { background: var(--chart-surface); color: var(--chart-muted); border: 1px solid var(--chart-border); }
    body.light-theme #timeframe-selector button:hover { background: var(--chart-surface-hover); color: var(--chart-text); }
    body.light-theme #timeframe-selector button.active { background: var(--chart-accent); color: var(--chart-selection-text); border-color: var(--chart-accent); }
    body.light-theme #source-zone-toggle { background: var(--chart-surface); color: var(--chart-muted); border-color: var(--chart-border); }
    body.light-theme #source-zone-toggle:hover { background: var(--chart-surface-hover); color: var(--chart-text); }
    body.light-theme #empty-state, body.light-theme #error-state, body.light-theme #watermark { color: var(--chart-subtle); }
    ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
  </style>
</head>
<body>
  <div id="chart-wrapper">
    <div id="chart-container"></div>
    <div id="timeframe-selector">
      <button data-tf="D1">D1</button>
      <button data-tf="H4">H4</button>
      <button data-tf="H1">H1</button>
      <button data-tf="M15">M15</button>
    </div>
    <label id="source-zone-toggle" title="Vùng cấu trúc tham khảo, không dùng để vào lệnh">
      <input id="source-zone-checkbox" type="checkbox" aria-label="Hiện vùng cấu trúc">
      <span>Vùng cấu trúc</span>
    </label>
    <div id="smc-caption"></div>
    <div id="empty-state">Chưa có dữ liệu biểu đồ</div>
    <div id="error-state">Không thể tải biểu đồ</div>
    <div id="watermark">AI Market Analyst</div>
  </div>

  <script src="lightweight-charts.standalone.production.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    // State
    var _chart = null;
    var _candleSeries = null;
    var _emaSeries = [];
    var _priceLines = [];
    var _zones = [];
    var _payload = null;
    var _activeTF = 'D1';
    var _showSourceZone = false;
    var _pyBridge = null;

    var COLORS = {
      bg: '#101214', text: '#f3f4f6', grid: '#1e2227', border: '#2d3238',
      buy: '#22c55e', sell: '#ef4444', tp: '#22c55e', sl: '#ef4444',
      ema20: '#f59e0b', ema50: '#3b82f6', ema200: '#ef4444',
      currentPrice: '#6b7280', neutral: '#6b7280',
      // Canonical SMC layer: the selected zone is the most visible, a watched
      // zone is neutral, an invalid zone is faded, and the M15 trigger keeps a
      // colour of its own so it is never confused with the zone band.
      smcSelected: '#22c55e', smcWatch: '#6b7280', smcInvalid: '#4b5563',
      smcTrigger: '#f59e0b', smcSwing: '#3b82f6',
    };

    // Legend colors for button text
    function _makeLegend(name, color) {
      return '<span style="color:' + color + '">●</span> ' + name;
    }

    var LEGENDS = {
      ema20: _makeLegend('EMA20', COLORS.ema20),
      ema50: _makeLegend('EMA50', COLORS.ema50),
      ema200: _makeLegend('EMA200', COLORS.ema200),
      sl: _makeLegend('SL', COLORS.sl),
      tp: _makeLegend('TP', COLORS.tp),
      entry: _makeLegend('Entry', COLORS.neutral),
      price: _makeLegend('Price', COLORS.currentPrice),
    };

    function _hide(id) { var el = document.getElementById(id); if (el) el.style.display = 'none'; }
    function _show(id) { var el = document.getElementById(id); if (el) el.style.display = 'block'; }

    function _resetSourceZoneToggle() {
      _showSourceZone = false;
      var sourceCheckbox = document.getElementById('source-zone-checkbox');
      if (sourceCheckbox) sourceCheckbox.checked = false;
      var sourceToggle = document.getElementById('source-zone-toggle');
      if (!sourceToggle) return;
      var zones = (_payload && _payload.zones) || [];
      var hasSource = zones.some(function(zone) { return zone.type === 'source_zone'; });
      // Task 145: the execution view has no structure zone to toggle.
      if (_isExecutionView(_activeTF)) hasSource = false;
      sourceToggle.style.display = hasSource ? 'inline-flex' : 'none';
    }

    function _addSeries(seriesType, options) {
      if (!_chart || !window.LightweightCharts) return null;
      if (typeof _chart.addSeries === 'function') {
        return _chart.addSeries(seriesType, options);
      }
      if (seriesType === LightweightCharts.CandlestickSeries && typeof _chart.addCandlestickSeries === 'function') {
        return _chart.addCandlestickSeries(options);
      }
      if (seriesType === LightweightCharts.LineSeries && typeof _chart.addLineSeries === 'function') {
        return _chart.addLineSeries(options);
      }
      throw new Error('Unsupported Lightweight Charts series API');
    }

    function _clearChart() {
      if (_chart) {
        try { _chart.remove(); } catch(e) {}
        _chart = null;
      }
      _candleSeries = null;
      _emaSeries = [];
      _priceLines = [];
      _zones = [];
      // The SMC caption belongs to the payload that was just cleared.
      var caption = document.getElementById('smc-caption');
      if (caption) { caption.textContent = ''; caption.style.display = 'none'; }
    }

    function showEmpty() {
      _clearChart();
      _payload = null;
      _hide('error-state');
      _show('empty-state');
      _resetSourceZoneToggle();
    }

    function showError(message) {
      _clearChart();
      _payload = null;
      var el = document.getElementById('error-state');
      if (el && message) el.textContent = message;
      _hide('empty-state');
      _show('error-state');
      _resetSourceZoneToggle();
    }

    function _initChart() {
      _clearChart();

      var container = document.getElementById('chart-container');
      if (!container) return null;

      // Dam bao container co kich thuoc
      var w = container.clientWidth || container.offsetWidth || 800;
      var h = container.clientHeight || container.offsetHeight || 500;
      if (w < 10) w = 800;
      if (h < 10) h = 500;

      _chart = LightweightCharts.createChart(container, {
        width: w,
        height: h,
        layout: { background: { type: 'solid', color: COLORS.bg }, textColor: COLORS.text },
        grid: { vertLines: { color: COLORS.grid }, horzLines: { color: COLORS.grid } },
        crosshair: { mode: 0, vertLine: { color: COLORS.border, style: 2, labelBackgroundColor: COLORS.border },
          horzLine: { color: COLORS.border, style: 2, labelBackgroundColor: COLORS.border } },
        rightPriceScale: { borderColor: COLORS.border, autoScale: true },
        timeScale: { borderColor: COLORS.border, timeVisible: true, secondsVisible: false },
        handleScroll: { mouseWheel: true, pressedMouseMove: true },
        handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: true },
        autoSize: true,
      });

      return _chart;
    }

    function _renderCandles() {
      if (!_payload || !_payload.timeframes || !_chart) return;

      var tfData = _payload.timeframes[_activeTF];
      if (!tfData || !tfData.candles || tfData.candles.length === 0) {
        _show('empty-state');
        return;
      }
      _hide('empty-state');

      var candles = tfData.candles.map(function(c) {
        var t = c.time;
        if (typeof t === 'string') {
          t = Math.floor(new Date(t).getTime() / 1000);
          if (isNaN(t) && c.time.indexOf('T') >= 0) {
            t = c.time.split('T')[0];
          }
        }
        return { time: t, open: c.open, high: c.high, low: c.low, close: c.close };
      });

      _candleSeries = _addSeries(LightweightCharts.CandlestickSeries, {
        upColor: COLORS.buy, downColor: COLORS.sell,
        borderUpColor: COLORS.buy, borderDownColor: COLORS.sell,
        wickUpColor: COLORS.buy, wickDownColor: COLORS.sell,
        priceFormat: { type: 'price', minMove: 0.00001, precision: 5 },
      });
      _candleSeries.setData(candles);

      // Price scale margin for levels (SL/TP lines can be far from price)
      var margin = 0.1;
      if (_payload.levels && _payload.levels.length > 0) {
        margin = 0.2;
      }
      _candleSeries.priceScale().applyOptions({ scaleMargins: { top: margin, bottom: margin } });

      // EMA lines
      if (tfData.indicators && tfData.indicators.length > 0) {
        var emaConfigs = [
          { key: 'ema20', color: COLORS.ema20 },
          { key: 'ema50', color: COLORS.ema50 },
          { key: 'ema200', color: COLORS.ema200 },
        ];
        for (var e = 0; e < emaConfigs.length; e++) {
          var cfg = emaConfigs[e];
          var points = [];
          for (var i = 0; i < tfData.indicators.length; i++) {
            var pt = tfData.indicators[i];
            if (pt[cfg.key] !== undefined && i < candles.length) {
              points.push({ time: candles[i].time, value: pt[cfg.key] });
            }
          }
          if (points.length > 0) {
            var line = _addSeries(LightweightCharts.LineSeries, {
              color: cfg.color, lineWidth: 1, priceLineVisible: false,
              lastValueVisible: false, crosshairMarkerVisible: false,
            });
            line.setData(points);
            _emaSeries.push(line);
          }
        }
      }

      _applyDefaultTimeScale(candles.length);
    }

    function _applyDefaultTimeScale(candleCount) {
      if (!_chart || !candleCount) return;
      // Default candle density: half the horizontal width per candle (barSpacing
      // 1.5 against the 3 it used to be), so twice as many candles fit the same
      // chart width.  Only the time axis is touched — the price scale, the OHLC
      // data and every manual zoom/pan keep their own behaviour.
      var visibleBars = 200;
      var rightOffset = 5;
      var from = Math.max(0, candleCount - visibleBars);
      var to = candleCount + rightOffset;
      var timeScale = _chart.timeScale();

      try {
        timeScale.applyOptions({
          barSpacing: 1.5,
          minBarSpacing: 1.5,
          rightOffset: rightOffset,
        });
      } catch(e) {}

      try {
        timeScale.setVisibleLogicalRange({ from: from, to: to });
      } catch(e) {
        try { timeScale.fitContent(); } catch(_e) {}
      }
    }

    function _clearOverlays() {
      // Remove price lines
      if (_candleSeries) {
        try {
          // Lightweight Charts v5: removePriceLine not available; recreate series instead
          // We handle this by recreating candles when switching overlays
        } catch(e) {}
      }
    }

    function _renderLevels() {
      if (!_payload || !_payload.levels || !_candleSeries) return;

      var levels = _payload.levels;
      for (var i = 0; i < levels.length; i++) {
        var lv = levels[i];
        var color = lv.type === 'stop_loss' ? COLORS.sl : COLORS.tp;
        var label = lv.label || '';
        try {
          var pl = _candleSeries.createPriceLine({
            price: lv.price,
            color: color,
            lineWidth: 1,
            lineStyle: 2, // dashed
            axisLabelVisible: true,
            title: label,
          });
          _priceLines.push(pl);
        } catch(e) {}
      }
    }

    function _renderEntryZone() {
      if (!_payload || !_payload.zones || !_candleSeries) return;

      var zones = _payload.zones;
      var side = (_payload.trade_plan && _payload.trade_plan.side) || 'neutral';
      var zoneColor = side === 'buy' ? COLORS.buy : (side === 'sell' ? COLORS.sell : COLORS.neutral);

      for (var z = 0; z < zones.length; z++) {
        var zn = zones[z];
        var isSource = zn.type === 'source_zone';
        // Task 145: a structure zone belongs to the SMC layer, so the execution
        // view never draws it — the Entry band and SL/TP are what remains.
        if (isSource && _isExecutionView(_activeTF)) continue;
        if (isSource && !_showSourceZone) continue;
        var drawColor = isSource ? COLORS.neutral : zoneColor;
        var upperTitle = isSource ? 'Source zone' : 'Entry+';
        var lowerTitle = isSource ? '' : 'Entry-';
        try {
          var pl = _candleSeries.createPriceLine({
            price: zn.to,
            color: drawColor,
            lineWidth: 1,
            lineStyle: isSource ? 4 : 2,
            axisLabelVisible: true,
            title: upperTitle,
          });
          _priceLines.push(pl);
          pl = _candleSeries.createPriceLine({
            price: zn.from,
            color: drawColor,
            lineWidth: 1,
            lineStyle: isSource ? 4 : 2,
            axisLabelVisible: !isSource,
            title: lowerTitle,
          });
          _priceLines.push(pl);
        } catch(e) {}
      }
    }

    function _renderCurrentPrice() {
      if (!_payload || _payload.current_price == null || !_candleSeries) return;
      try {
        var pl = _candleSeries.createPriceLine({
          price: _payload.current_price,
          color: COLORS.currentPrice,
          lineWidth: 1,
          lineStyle: 2,
          axisLabelVisible: false,
          title: '',
        });
        _priceLines.push(pl);
      } catch(e) {}
    }

    // --- Canonical SMC layer (task 124) -------------------------------------
    // Draws ONLY what core/chart_payload built from the canonical selection of
    // this scan: the selected/invalid zone band, the M15 trigger band and the
    // protected swing when the payload publishes one.  Nothing here detects a
    // zone, moves an event in time or falls back to a legacy zone: a payload
    // without the layer simply draws nothing.
    //
    // Task 145 (Lô D): an EXECUTION-VIEW timeframe draws candles + the plan's
    // Entry band + SL/TP and NOTHING of the SMC layer.  The rule is read from
    // the payload, so it holds on every client-side timeframe switch.  The
    // overlay data is untouched — this only declines to draw it here.
    function _isExecutionView(tf) {
      if (!_payload || !_payload.execution_view_timeframes) return false;
      var views = _payload.execution_view_timeframes;
      if (!views.length) return false;
      return views.indexOf(tf) >= 0;
    }

    function _smcLayer() {
      if (!_payload || !_payload.smc_overlay) return null;
      if (_isExecutionView(_activeTF)) return null;
      var overlay = _payload.smc_overlay;
      if (!overlay.available || !overlay.timeframes) return null;
      var layer = overlay.timeframes[_activeTF];
      return layer || null;
    }

    function _smcZoneColor(zone) {
      var status = (zone && zone.status) || '';
      if (status === 'invalid') return COLORS.smcInvalid;
      if (status === 'watch') return COLORS.smcWatch;
      if (status === 'selected') {
        return zone && zone.side === 'sell' ? COLORS.sell : COLORS.buy;
      }
      return COLORS.neutral;
    }

    function _addSmcPriceLine(price, options) {
      if (typeof price !== 'number' || !isFinite(price)) return;
      try {
        _priceLines.push(_candleSeries.createPriceLine(options));
      } catch(e) {}
    }

    function _renderSmcOverlay() {
      if (!_candleSeries) return;
      var layer = _smcLayer();
      var caption = document.getElementById('smc-caption');
      if (caption) {
        if (layer && layer.caption) {
          caption.textContent = layer.caption;
          caption.style.display = 'block';
        } else {
          caption.textContent = '';
          caption.style.display = 'none';
        }
      }
      if (!layer) return;

      var zones = layer.zones || [];
      for (var z = 0; z < zones.length; z++) {
        var zone = zones[z];
        var color = _smcZoneColor(zone);
        var label = zone.label || 'SMC';
        // An invalid zone is drawn faded and dashed so it never reads as a
        // usable level; the selected one is solid and labelled.
        var isInvalid = zone.status === 'invalid';
        var lineStyle = isInvalid ? 4 : (zone.status === 'selected' ? 0 : 2);
        var lineWidth = zone.status === 'selected' ? 2 : 1;
        var upperTitle = 'SMC ' + label + ' ▲';
        var lowerTitle = 'SMC ' + label + ' ▼';
        _addSmcPriceLine(zone.to, {
          price: zone.to, color: color, lineWidth: lineWidth,
          lineStyle: lineStyle, axisLabelVisible: true, title: upperTitle,
        });
        _addSmcPriceLine(zone.from, {
          price: zone.from, color: color, lineWidth: lineWidth,
          lineStyle: lineStyle, axisLabelVisible: true, title: lowerTitle,
        });
      }

      var trigger = layer.trigger;
      if (trigger) {
        var triggerLabel = trigger.label || 'Xác nhận M15';
        if (trigger.trigger_at) {
          triggerLabel += ' · ' + trigger.trigger_at;
        }
        _addSmcPriceLine(trigger.to, {
          price: trigger.to, color: COLORS.smcTrigger, lineWidth: 1,
          lineStyle: 1, axisLabelVisible: false, title: triggerLabel,
        });
        _addSmcPriceLine(trigger.from, {
          price: trigger.from, color: COLORS.smcTrigger, lineWidth: 1,
          lineStyle: 1, axisLabelVisible: false, title: '',
        });
      }

      var swing = layer.protected_swing;
      if (swing) {
        _addSmcPriceLine(swing.level, {
          price: swing.level, color: COLORS.smcSwing, lineWidth: 1,
          lineStyle: 3, axisLabelVisible: true,
          title: swing.label || 'Đỉnh/đáy bảo vệ',
        });
      }
    }

    function _updateActiveButton() {
      var buttons = document.querySelectorAll('#timeframe-selector button');
      for (var i = 0; i < buttons.length; i++) {
        var btn = buttons[i];
        if (btn.getAttribute('data-tf') === _activeTF) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    }

    function _fitPriceScale() {
      if (!_chart || !_candleSeries || !_payload) return;

      // Collect all price levels that should be visible
      var prices = [];

      // From levels (SL/TP)
      var levels = _payload.levels || [];
      for (var i = 0; i < levels.length; i++) {
        if (typeof levels[i].price === 'number' && isFinite(levels[i].price)) {
          prices.push(levels[i].price);
        }
      }

      // From zones (Entry)
      var zones = _payload.zones || [];
      for (var j = 0; j < zones.length; j++) {
        if (zones[j].type === 'source_zone' && !_showSourceZone) continue;
        if (typeof zones[j].from === 'number' && isFinite(zones[j].from)) {
          prices.push(zones[j].from);
        }
        if (typeof zones[j].to === 'number' && isFinite(zones[j].to)) {
          prices.push(zones[j].to);
        }
      }

      // Current price
      if (typeof _payload.current_price === 'number' && isFinite(_payload.current_price)) {
        prices.push(_payload.current_price);
      }

      // Canonical SMC layer: only the bands that are still live take part in the
      // price range.  An invalid band stays visible when it happens to be in
      // view but never drags the scale to a level the setup no longer uses.
      var smcLayer = _smcLayer();
      if (smcLayer) {
        var smcZones = smcLayer.zones || [];
        for (var s = 0; s < smcZones.length; s++) {
          if (smcZones[s].status === 'invalid') continue;
          if (typeof smcZones[s].from === 'number' && isFinite(smcZones[s].from)) {
            prices.push(smcZones[s].from);
          }
          if (typeof smcZones[s].to === 'number' && isFinite(smcZones[s].to)) {
            prices.push(smcZones[s].to);
          }
        }
      }

      if (prices.length === 0) return;

      var minPrice = Math.min.apply(null, prices);
      var maxPrice = Math.max.apply(null, prices);
      var range = maxPrice - minPrice;
      if (range <= 0) return;

      // Expand by 5% margin
      var margin = range * 0.05;
      try {
        _candleSeries.priceScale().applyOptions({
          autoScale: false,
        });
        _chart.timeScale().subscribeVisibleLogicalRangeChange(function(logicalRange) {
          if (logicalRange) {
            _candleSeries.priceScale().applyOptions({
              autoScale: false,
            });
          }
        });
      } catch(e) {}
    }

    function _captureVisibleRange() {
      if (!_chart) return null;
      try {
        var range = _chart.timeScale().getVisibleLogicalRange();
        if (!range) return null;
        return { from: range.from, to: range.to };
      } catch(e) {
        return null;
      }
    }

    function _restoreVisibleRange(range) {
      if (!_chart || !range) return false;
      try {
        var from = range.from;
        var to = range.to;
        if (typeof from !== 'number' || typeof to !== 'number') return false;
        _chart.timeScale().setVisibleLogicalRange({ from: from, to: to });
        return true;
      } catch(e) {
        return false;
      }
    }

    // === Public API ===

    function applyChartTheme(theme, palette) {
      palette = palette || {};
      var isLight = theme === 'light';
      document.body.classList.toggle('light-theme', isLight);
      document.body.classList.toggle('dark-theme', !isLight);
      document.documentElement.classList.toggle('light-theme', isLight);
      document.documentElement.classList.toggle('dark-theme', !isLight);

      COLORS.bg = palette.background || (isLight ? '#f4f1ea' : '#0f1216');
      COLORS.text = palette.text || (isLight ? '#111827' : '#e5e7eb');
      COLORS.grid = palette.grid || (isLight ? '#e5e7eb' : '#1e2227');
      COLORS.border = palette.border || (isLight ? '#d6d2c8' : '#334155');
      COLORS.buy = palette.buy || COLORS.buy;
      COLORS.sell = palette.sell || COLORS.sell;
      COLORS.tp = palette.buy || COLORS.tp;
      COLORS.sl = palette.sell || COLORS.sl;
      COLORS.neutral = palette.neutral || COLORS.neutral;
      COLORS.currentPrice = palette.neutral || COLORS.currentPrice;
      COLORS.ema20 = palette.warning || COLORS.ema20;
      COLORS.ema50 = palette.info || COLORS.ema50;
      COLORS.ema200 = palette.sell || COLORS.ema200;
      COLORS.smcSelected = palette.buy || COLORS.smcSelected;
      COLORS.smcTrigger = palette.warning || COLORS.smcTrigger;
      COLORS.smcSwing = palette.info || COLORS.smcSwing;
      COLORS.smcWatch = palette.neutral || COLORS.smcWatch;

      var rootStyle = document.documentElement.style;
      rootStyle.setProperty('--chart-background', COLORS.bg);
      rootStyle.setProperty('--chart-text', COLORS.text);
      rootStyle.setProperty('--chart-muted', palette.neutral || COLORS.neutral);
      rootStyle.setProperty('--chart-subtle', palette.neutral || COLORS.neutral);
      rootStyle.setProperty('--chart-surface', palette.surface || COLORS.grid);
      rootStyle.setProperty('--chart-surface-hover', palette.surfaceRaised || COLORS.border);
      rootStyle.setProperty('--chart-border', COLORS.border);
      rootStyle.setProperty('--chart-accent', palette.accent || COLORS.neutral);
      rootStyle.setProperty('--chart-selection-text', palette.selectionText || '#ffffff');

      if (_chart) {
        _chart.applyOptions({
          layout: { background: { type: 'solid', color: COLORS.bg }, textColor: COLORS.text },
          grid: { vertLines: { color: COLORS.grid }, horzLines: { color: COLORS.grid } },
          crosshair: {
            vertLine: { color: COLORS.border, labelBackgroundColor: COLORS.border },
            horzLine: { color: COLORS.border, labelBackgroundColor: COLORS.border },
          },
          rightPriceScale: { borderColor: COLORS.border },
          timeScale: { borderColor: COLORS.border },
        });
      }
    }

    function setChartData(payload) {
      _hide('empty-state');
      _hide('error-state');

      if (!payload || typeof payload !== 'object') {
        _show('error-state');
        return;
      }

      try {
        applyChartTheme(payload.theme, payload.palette);
        _payload = payload;
        _activeTF = payload.active_timeframe || 'D1';
        _resetSourceZoneToggle();

        if (!payload.timeframes || Object.keys(payload.timeframes).length === 0) {
          showEmpty();
          return;
        }

        var savedRange = _chart ? _captureVisibleRange() : null;
        if (!_initChart()) {
          showError('Không thể khởi tạo biểu đồ.');
          return;
        }
        _renderCandles();
        _renderLevels();
        _renderEntryZone();
        _renderCurrentPrice();
        _renderSmcOverlay();
        _fitPriceScale();
        _updateActiveButton();
        if (savedRange) {
          _restoreVisibleRange(savedRange);
        }

        // Legend
        if (_chart) {
          _chart.applyOptions({ watermark: { visible: false } });
        }
      } catch(e) {
        showError('Không thể tải biểu đồ: ' + (e && e.message ? e.message : e));
      }
    }

    function switchTimeframe(tf) {
      if (!_payload) return;
      if (!_payload.timeframes || !_payload.timeframes[tf]) return;

      _activeTF = tf;
      _payload.active_timeframe = tf;

      // Reinitialize chart for new timeframe
      if (!_initChart()) {
        _show('error-state');
        return;
      }
      _renderCandles();
      _renderLevels();
      _renderEntryZone();
      _renderCurrentPrice();
      _renderSmcOverlay();
      _fitPriceScale();
      _updateActiveButton();
    }

    function reloadChart() {
      if (!_payload) return;
      if (!_initChart()) {
        _show('error-state');
        return;
      }
      _renderCandles();
      _renderLevels();
      _renderEntryZone();
      _renderCurrentPrice();
      _renderSmcOverlay();
      _fitPriceScale();
      _updateActiveButton();
    }

    function handleResize() {
      if (!_chart) return;
      var container = document.getElementById('chart-container');
      if (!container) return;
      var w = container.clientWidth;
      var h = container.clientHeight;
      if (w > 0 && h > 0) {
        _chart.resize(w, h);
      }
    }

    // Expose to window
    window.setChartData = setChartData;
    window.switchTimeframe = switchTimeframe;
    window.reloadChart = reloadChart;
    window.handleResize = handleResize;
    window.applyChartTheme = applyChartTheme;
    window.showEmpty = showEmpty;
    window.showError = showError;

    // Connect to Python bridge so timeframe switches reach the Python side
    if (window.qt && window.qt.webChannelTransport && typeof QWebChannel !== 'undefined') {
      new QWebChannel(window.qt.webChannelTransport, function(channel) {
        _pyBridge = channel.objects.chartBridge;
      });
    }

    // Timeframe selector click handlers
    var buttons = document.querySelectorAll('#timeframe-selector button');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function(e) {
        var tf = this.getAttribute('data-tf');
        if (tf) {
          switchTimeframe(tf);
          if (_pyBridge) _pyBridge.onTimeframeChanged(tf);
        }
      });
    }

    var sourceCheckbox = document.getElementById('source-zone-checkbox');
    if (sourceCheckbox) {
      sourceCheckbox.addEventListener('change', function() {
        _showSourceZone = this.checked === true;
        reloadChart();
      });
    }

    // Resize observer
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(function() { handleResize(); });
      var container = document.getElementById('chart-container');
      if (container) ro.observe(container);
    }
    window.addEventListener('resize', handleResize);

    // Initial state
    _show('empty-state');
  </script>
</body>
</html>
